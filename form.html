<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a0a0f">
<title>Form Pemesanan | DewaTiket.id</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
:root{
    --bg-primary:#0a0a0f;
    --bg-card:rgba(28,28,38,.7);
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.15);
    --text-primary:#ffffff;
    --text-secondary:rgba(255,255,255,.7);
    --text-muted:rgba(255,255,255,.5);
    --accent-gold:#f5b800;
    --accent-red:#e50024;
    --gradient-gold:linear-gradient(135deg,#f5b800 0%,#d4950a 100%);
    --gradient-red:linear-gradient(135deg,#e50024 0%,#990018 100%);
    --gradient-card:linear-gradient(145deg,rgba(40,40,55,.6) 0%,rgba(20,20,28,.6) 100%);
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);
    --radius:18px;
    --radius-lg:24px;
    --transition:all .3s cubic-bezier(.4,0,.2,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
    background:var(--bg-primary);
    color:var(--text-primary);
    min-height:100vh;
    padding-bottom:130px;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 10%,rgba(229,0,36,.12) 0%,transparent 40%),
        radial-gradient(circle at 80% 80%,rgba(245,184,0,.08) 0%,transparent 40%);
    z-index:-1;
    pointer-events:none;
}

/* HEADER */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:80px;
    background:rgba(10,10,15,.75);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    border-bottom:1px solid var(--border);
}

.header-left,.header-right{
    width:70px;
    display:flex;
    align-items:center;
}
.header-left{justify-content:flex-start}
.header-right{justify-content:flex-end;gap:14px}

.logo{
    background:var(--gradient-gold);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
    white-space:nowrap;
    text-decoration:none;
}

.icon-btn{
    width:42px; height:42px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:#fff;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:var(--transition);
    text-decoration:none;
}
.icon-btn:hover{
    background:rgba(255,255,255,.08);
    border-color:var(--border-strong);
    transform:translateY(-2px);
}
.icon-btn svg{width:22px;height:22px;stroke:currentColor}

/* CONTAINER */
.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:30px 20px 40px;
}

/* HERO BANNER */
.hero-banner{
    position:relative;
    border-radius:var(--radius-lg);
    overflow:hidden;
    margin-bottom:-50px;
    z-index:1;
    box-shadow:var(--shadow-lg);
    border:1px solid var(--border);
}
.hero-banner img{
    width:100%;
    aspect-ratio:2.5/1;
    object-fit:cover;
    display:block;
}

.hero-card{
    position:relative;
    z-index:2;
    background:var(--gradient-card);
    backdrop-filter:blur(15px);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    margin-bottom:30px;
}
.hero-card h2{
    font-size:28px;
    font-weight:800;
    margin-bottom:6px;
    letter-spacing:-0.5px;
    background:var(--gradient-gold);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero-card p{
    color:var(--text-muted);
    font-size:14px;
    margin-bottom:18px;
}
.event-info{
    display:flex; justify-content:center; gap:20px; flex-wrap:wrap;
    color:var(--text-secondary); font-size:14px; font-weight:500;
}
.event-info div{display:flex; align-items:center; gap:8px;}
.event-info i{color:var(--accent-gold);}

/* FORM CARD */
.form-card{
    background:var(--gradient-card);
    backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    opacity:0;
    transform:translateY(20px);
    animation:fadeUp .6s ease forwards;
}
.form-card:nth-child(2){animation-delay:.1s}
.form-card:nth-child(3){animation-delay:.2s}
.form-card:nth-child(4){animation-delay:.3s}

@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.card-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
    padding-bottom:16px;
}
.card-title i{color:var(--accent-gold);font-size:18px}

.form-group{margin-bottom:18px;}
.form-group label{display:block; font-weight:600; font-size:14px; margin-bottom:8px; color:var(--text-secondary);}
.input-icon-wrap{position:relative; display:flex; align-items:center;}
.input-icon{position:absolute; left:16px; font-size:15px; color:var(--text-muted); pointer-events:none; transition:var(--transition);}

input, select, textarea{
    width:100%;
    padding:14px 16px 14px 46px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:rgba(255,255,255,0.04);
    color:var(--text-primary);
    font-size:15px;
    transition:var(--transition);
    font-family:'Plus Jakarta Sans', sans-serif;
}
textarea{resize:vertical; min-height:100px; padding-left:16px;}
select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f5b800' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat;
    background-position:right 16px center;
    background-size:16px;
    cursor:pointer;
}
select option{background:#13131a;}

input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent-gold);
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 0 3px rgba(245,184,0,0.1);
}
.input-icon-wrap:focus-within .input-icon{color:var(--accent-gold);}
input.error, select.error, textarea.error{
    border-color:var(--accent-red);
    background:rgba(229,0,36,0.05);
    box-shadow:0 0 0 3px rgba(229,0,36,0.1);
    animation:shake 0.4s;
}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

/* SUMMARY */
.summary-row{display:flex; justify-content:space-between; padding:10px 0; font-size:14px; color:var(--text-secondary);}
.summary-row strong{color:#fff; font-weight:600;}
.total{
    font-size:16px; font-weight:700; color:#fff;
    border-top:1px dashed var(--border-strong); margin-top:10px; padding-top:16px;
}
.total span{color:var(--accent-gold); font-size:22px; font-weight:800;}

/* CHECKBOX */
.check{
    display:flex; gap:14px; margin-top:14px; align-items:flex-start;
    background:rgba(255,255,255,0.03); padding:16px;
    border-radius:var(--radius); border:1px solid var(--border);
}
.check input{width:20px; height:20px; min-width:20px; accent-color:var(--accent-red); cursor:pointer; margin-top:2px;}
.check label{font-size:14px; color:var(--text-secondary); cursor:pointer; line-height:1.5;}

/* BOTTOM BAR */
.bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:2000;
    background:rgba(10,10,15,0.85);
    backdrop-filter:blur(20px) saturate(180%);
    padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    box-shadow:0 -10px 40px rgba(0,0,0,0.5);
}
.bottom-inner{
    max-width:900px; margin:auto; height:90px;
    background:linear-gradient(135deg,rgba(255,255,255,.95) 0%,rgba(245,245,250,.95) 100%);
    border-radius:var(--radius-lg);
    overflow:hidden; display:flex; align-items:stretch;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.bottom-price{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:0 28px; color:#111;
}
.bottom-label{font-size:13px; font-weight:600; color:#666; margin-bottom:4px;}
.bottom-total{font-size:26px; font-weight:800; letter-spacing:-0.5px;}

.buy-btn{
    width:38%; border:0;
    background:var(--gradient-red); color:#fff;
    font-size:16px; font-weight:800; cursor:pointer;
    position:relative; overflow:hidden;
    transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:8px;
}
.buy-btn:hover{box-shadow:0 0 30px rgba(229,0,36,0.5);}
.buy-btn:disabled{opacity:0.7; cursor:wait;}

/* PREMIUM LOADING */
.loading-overlay{
    position:fixed; inset:0; z-index:9999;
    background:rgba(10,10,15,0.97);
    backdrop-filter:blur(20px);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:30px;
    opacity:0; visibility:hidden;
    transition:opacity .4s ease,visibility .4s ease;
}
.loading-overlay.active{opacity:1; visibility:visible;}
.loader{position:relative; width:80px; height:80px;}
.loader-ring{position:absolute; inset:0; border:3px solid transparent; border-radius:50%;}
.loader-ring:nth-child(1){border-top-color:var(--accent-red); animation:spin 1s linear infinite; box-shadow:0 0 20px rgba(229,0,36,.5);}
.loader-ring:nth-child(2){inset:10px; border-right-color:var(--accent-gold); animation:spin 1.5s linear infinite reverse; box-shadow:0 0 15px rgba(245,184,0,.4);}
.loader-ring:nth-child(3){inset:20px; border-bottom-color:#fff; animation:spin 2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:18px; font-weight:700; color:#fff; letter-spacing:1px;}
.loading-subtext{font-size:13px; color:var(--text-muted); margin-top:8px; font-weight:500;}

/* TOAST */
.toast{
    position:fixed; top:90px; left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:var(--gradient-red); color:#fff;
    padding:14px 24px; border-radius:12px;
    font-size:14px; font-weight:600;
    box-shadow:0 10px 30px rgba(229,0,36,0.4);
    z-index:3000; opacity:0;
    transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease;
    max-width:90vw; text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1;}

@media(max-width:700px){
    .header{height:70px; padding:0 18px;}
    .logo{font-size:24px;}
    .header-left,.header-right{width:50px;}
    .icon-btn{width:38px; height:38px;}
    .container{padding:20px 16px 40px;}
    .hero-card{padding:24px 20px;}
    .hero-card h2{font-size:22px;}
    .form-card{padding:22px 20px;}
    .bottom-bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
    .bottom-inner{height:80px;}
    .bottom-price{padding:0 20px;}
    .bottom-total{font-size:22px;}
    .buy-btn{font-size:14px;}
}
</style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <button class="icon-btn" onclick="history.back()" aria-label="Kembali">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
        </button>
    </div>
    <a href="index.html" class="logo">DewaTiket.id</a>
    <div class="header-right">
        <button class="icon-btn" aria-label="Bantuan">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </button>
    </div>
</header>

<main class="container">
    <div class="hero-banner">
        <img src="banner.png" alt="Spectra Fest 2026 Banner">
    </div>

    <div class="hero-card">
        <h2>Spectra Fest 2026</h2>
        <p>Dipersembahkan oleh DewaTiket.id</p>
        <div class="event-info">
            <div><i class="fa-solid fa-calendar-days"></i> 05 Desember 2026</div>
            <div><i class="fa-solid fa-location-dot"></i> Lapangan Niti Mandala Renon, Denpasar</div>
        </div>
    </div>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-receipt"></i> Ringkasan Pesanan</div>
        <div class="summary-row"><span>Jenis Tiket</span><strong id="jenisTiket">-</strong></div>
        <div id="detailTiket"></div>
        <div class="summary-row"><span>Jumlah Tiket</span><strong id="jumlahTiket">0</strong></div>
        <div class="summary-row total"><span>Total Pembayaran</span><span id="totalBayar">Rp 0</span></div>
    </section>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-user-pen"></i> Data Pemesan</div>
        <div class="form-group">
            <label>Nama Lengkap (sesuai identitas)</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-user input-icon"></i>
                <input id="nama" type="text" placeholder="Masukkan nama lengkap">
            </div>
        </div>
        <div class="form-group">
            <label>Jenis Identitas</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-id-card input-icon"></i>
                <select id="identitas">
                    <option value="">Pilih Jenis Identitas</option>
                    <option>KTP</option><option>SIM</option><option>Paspor</option><option>Kartu Pelajar</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Nomor Identitas</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-hashtag input-icon"></i>
                <input id="nomorId" type="text" placeholder="Masukkan nomor identitas">
            </div>
        </div>
        <div class="form-group">
            <label>E-mail Aktif</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input id="email" type="email" placeholder="contoh@email.com">
            </div>
        </div>
        <div class="form-group">
            <label>No. WhatsApp Aktif</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-phone input-icon"></i>
                <input id="wa" type="tel" placeholder="08xxxxxxxxxx">
            </div>
        </div>
        <div class="form-group">
            <label>Alamat / Tempat Tinggal</label>
            <div class="input-icon-wrap">
                <textarea id="alamat" placeholder="Masukkan alamat lengkap"></textarea>
            </div>
        </div>
    </section>

    <section class="form-card">
        <div class="card-title"><i class="fa-solid fa-shield-halved"></i> Persetujuan</div>
        <div class="check">
            <input type="checkbox" id="setuju1">
            <label for="setuju1">Data yang saya isi adalah benar dan dapat dipertanggungjawabkan.</label>
        </div>
        <div class="check">
            <input type="checkbox" id="setuju2">
            <label for="setuju2">Saya menyetujui syarat dan ketentuan acara serta kebijakan privasi.</label>
        </div>
    </section>
</main>

<div class="bottom-bar">
    <div class="bottom-inner">
        <div class="bottom-price">
            <div class="bottom-label">Total Bayar</div>
            <div class="bottom-total" id="bottomTotal">Rp 0</div>
        </div>
        <button class="buy-btn" id="lanjut">LANJUT <i class="fa-solid fa-arrow-right"></i></button>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loader">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
    </div>
    <div style="text-align:center">
        <div class="loading-text">Menyiapkan Pembayaran</div>
        <div class="loading-subtext">Mohon tunggu sebentar</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // Ambil data dari LocalStorage (dari halaman index.html / spectrafest.html)
    const selectedTickets = JSON.parse(localStorage.getItem('selectedTickets') || '[]');
    const totalPrice = parseInt(localStorage.getItem('ticketTotal') || '0');

    let cartItems = selectedTickets.map(t => ({
        id: t.type,
        name: t.name,
        qty: t.qty,
        harga: t.price,
        total: t.price * t.qty
    }));

    let totalQty = 0;
    cartItems.forEach(item => totalQty += item.qty);

    // Elemen DOM
    const namaEl = document.getElementById('nama');
    const identitasEl = document.getElementById('identitas');
    const nomorIdEl = document.getElementById('nomorId');
    const emailEl = document.getElementById('email');
    const waEl = document.getElementById('wa');
    const alamatEl = document.getElementById('alamat');
    const setuju1El = document.getElementById('setuju1');
    const setuju2El = document.getElementById('setuju2');
    const loadingEl = document.getElementById('loadingOverlay');
    const lanjutBtn = document.getElementById('lanjut');

    // Tampilkan ringkasan pesanan
    const formattedTotal = 'Rp ' + totalPrice.toLocaleString('id-ID');
    document.getElementById('totalBayar').innerText = formattedTotal;
    document.getElementById('jumlahTiket').innerText = totalQty;
    document.getElementById('bottomTotal').innerText = formattedTotal;
    
    let detailHtml = '';
    let jenisTiketText = '';
    cartItems.forEach(item => {
        detailHtml += `<div class="summary-row"><span>${item.name} (${item.qty}x)</span><strong>Rp ${item.total.toLocaleString('id-ID')}</strong></div>`;
        jenisTiketText += `${item.name} (${item.qty})<br>`;
    });
    document.getElementById('detailTiket').innerHTML = detailHtml;
    document.getElementById('jenisTiket').innerHTML = jenisTiketText || 'Tidak ada tiket dipilih';

    // Simpan Draft Form ke LocalStorage
    function saveDraft() {
        try {
            localStorage.setItem('draft_nama', namaEl.value);
            localStorage.setItem('draft_identitas', identitasEl.value);
            localStorage.setItem('draft_nomorId', nomorIdEl.value);
            localStorage.setItem('draft_email', emailEl.value);
            localStorage.setItem('draft_wa', waEl.value);
            localStorage.setItem('draft_alamat', alamatEl.value);
        } catch(e) {}
    }
    function restoreDraft() {
        try {
            namaEl.value = localStorage.getItem('draft_nama') || '';
            identitasEl.value = localStorage.getItem('draft_identitas') || '';
            nomorIdEl.value = localStorage.getItem('draft_nomorId') || '';
            emailEl.value = localStorage.getItem('draft_email') || '';
            waEl.value = localStorage.getItem('draft_wa') || '';
            alamatEl.value = localStorage.getItem('draft_alamat') || '';
        } catch(e) {}
    }
    restoreDraft();

    [namaEl, identitasEl, nomorIdEl, emailEl, waEl, alamatEl].forEach(el => {
        el.addEventListener('input', saveDraft);
        el.addEventListener('change', saveDraft);
    });

    // Toast Notification
    let toastTimer = null;
    function showToast(message){
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        if(toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Validasi & Submit
    lanjutBtn.onclick = function() {
        const wajib = [namaEl, identitasEl, nomorIdEl, emailEl, waEl, alamatEl];
        let isValid = true;
        wajib.forEach(field => field.classList.remove('error'));

        for (const field of wajib) {
            if (!field.value.trim()) {
                field.classList.add('error');
                isValid = false;
            }
        }

        if (!isValid) {
            showToast('Mohon lengkapi semua data wajib (berwarna merah).');
            const firstError = document.querySelector('.error');
            if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        if (!setuju1El.checked || !setuju2El.checked) {
            showToast('Harap centang seluruh kotak persetujuan.');
            return;
        }

        // Tampilkan loading premium
        loadingEl.classList.add('active');
        lanjutBtn.disabled = true;
        lanjutBtn.innerHTML = 'MEMPROSES...';

        // Siapkan data pesanan untuk Formspree
        const orderData = {
            event: "Spectra Fest 2026",
            nama: namaEl.value, 
            wa: waEl.value, 
            email: emailEl.value,
            identitas: identitasEl.value, 
            nomor_id: nomorIdEl.value, 
            alamat: alamatEl.value,
            detail_pesanan: cartItems,
            jumlah_tiket: totalQty, 
            total_bayar: totalPrice
        };

        // Simpan data cadangan ke LocalStorage
        try {
            localStorage.setItem('protix_order', JSON.stringify(orderData));
        } catch(e) {}

        // Kirim data ke Formspree
        fetch('https://formspree.io/f/mojojdpl', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(orderData)
        }).catch(e => console.log('Formspree error:', e));

        // Redirect ke qris.html bawa parameter URL
        const qrisParams = new URLSearchParams({
            nama: namaEl.value, 
            wa: waEl.value, 
            totalQty: totalQty,
            total: totalPrice
        });
        
        setTimeout(() => {
            window.location.href = 'qris.html?' + qrisParams.toString();
        }, 1500); // Delay 1.5 detik agar loading terlihat
    };
</script>
</body>
</html>
